# GitHub Actions CI for bigo-sg/velox.
# Mirrors the GitLab CI build: uses the velox-deps Docker image with all
# C++ dependencies pre-installed, builds with GCC-11 + Ninja.

name: Linux Gluten Build

on:
  push:
    branches:
      - "gluten-0530"
    paths:
      - "velox/**"
      - "!velox/docs/**"
      - "CMakeLists.txt"
      - "CMake/**"
      - "third_party/**"
      - ".github/workflows/linux-gluten-build.yml"
      - ".gitlab-ci.yml"

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "velox/**"
      - "!velox/docs/**"
      - "CMakeLists.txt"
      - "CMake/**"
      - "third_party/**"
      - ".github/workflows/linux-gluten-build.yml"
      - ".gitlab-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  velox-build:
    name: Build Velox
    runs-on: ubuntu-latest
    container: listar1111/velox-deps:ubuntu20
    defaults:
      run:
        shell: bash
    env:
      CC: /usr/bin/gcc-11
      CXX: /usr/bin/g++-11
      CCACHE_DIR: "${{ github.workspace }}/ccache"
    steps:
      - uses: actions/checkout@v4

      - name: Fix git permissions
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}

      - name: Ensure ccache directory exists
        run: mkdir -p "${CCACHE_DIR}"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gluten-build-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-gluten-build-${{ github.ref_name }}-
            ccache-gluten-build-

      - name: Zero Ccache Statistics
        run: ccache -sz

      - name: Configure
        run: |
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DVELOX_ENABLE_CCACHE=ON \
            -DVELOX_BUILD_SHARED=ON \
            -DVELOX_MONO_LIBRARY=ON \
            -DVELOX_ENABLE_KAFKA_CONNECTOR=ON \
            -DVELOX_ENABLE_PULSAR_CONNECTOR=ON \
            -DVELOX_CPR_USE_SYSTEM_CURL=ON \
            -DTREAT_WARNINGS_AS_ERRORS=0 \
            -S . -B _build/release

      - name: Build Velox
        run: cmake --build _build/release --target velox -j $(nproc)

      - name: Ccache after build
        run: ccache -s

      - name: Save ccache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gluten-build-${{ github.ref_name }}-${{ github.sha }}
